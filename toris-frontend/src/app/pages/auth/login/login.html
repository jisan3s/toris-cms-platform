<app-header />

<!-- ================= PAGE BANNER ================= -->
<section class="page-banner text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Login</h1>
        <p class="lead">Access your account securely</p>
    </div>
</section>

<!-- ================= LOGIN FORM ================= -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="fw-bold mb-4 text-center">Sign In</h4>
                    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" formControlName="email">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password" formControlName="password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || isSubmitting">
                            {{ isSubmitting ? 'Logging in...' : 'Login' }}
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a routerLink="/forgot-password">Forgot Password?</a> |
                        <a routerLink="/register">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer />
