<app-header />

<!-- ================= PAGE BANNER ================= -->
<section class="page-banner text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Forgot Password</h1>
        <p class="lead">Enter your email to reset your password</p>
    </div>
</section>

<!-- ================= FORGOT PASSWORD FORM ================= -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="fw-bold mb-4 text-center">Reset Password</h4>
                    <form [formGroup]="forgotForm" (ngSubmit)="submitForgot()">
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" formControlName="email">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" [disabled]="forgotForm.invalid || isSubmitting">
                            {{ isSubmitting ? 'Checking...' : 'Continue' }}
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a routerLink="/login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer />
