<app-header />

<section class="bg-dark text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Reset Password</h1>
        <p>Set a new password for your account</p>
    </div>
</section>

<section class="py-5">
    <div class="container d-flex justify-content-center">
        <div class="card p-4 shadow-sm w-100" style="max-width: 400px;">
            <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="New Password" formControlName="password">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Confirm New Password" formControlName="confirmPassword">
                </div>
                <button type="submit" class="btn btn-primary w-100" [disabled]="resetForm.invalid || isSubmitting">
                    {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}
                </button>
            </form>
        </div>
    </div>
</section>

<app-footer />
