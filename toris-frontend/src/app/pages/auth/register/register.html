<app-header />

<!-- ================= PAGE BANNER ================= -->
<section class="page-banner text-white text-center py-5">
    <div class="container">
        <h1 class="fw-bold">Register</h1>
        <p class="lead">Create your account to get started</p>
    </div>
</section>

<!-- ================= REGISTER FORM ================= -->
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4">
                    <h4 class="fw-bold mb-4 text-center">Sign Up</h4>
                    <form [formGroup]="registerForm" (ngSubmit)="submitRegister()">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Full Name" formControlName="name">
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" formControlName="email">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Password" formControlName="password">
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="Confirm Password" formControlName="confirmPassword">
                        </div>
                        @if (registerForm.errors?.['mismatch']) {
                            <div class="text-danger mb-3">
                                Passwords do not match
                            </div>
                        }
                        <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid || isSubmitting">
                            {{ isSubmitting ? 'Registering...' : 'Register' }}
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a routerLink="/login">Already have an account? Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer />
