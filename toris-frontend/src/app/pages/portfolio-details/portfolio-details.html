<app-header />

<section class="page-banner text-white text-center py-5">
        <div class="container">
            <h1 class="fw-bold" [innerHTML]="bannerTitle | richText"></h1>
            <p class="lead" [innerHTML]="bannerSubtitle | richText"></p>
        </div>
</section>

@if (item) {
<section class="py-5">
    <div class="container">
        <div class="row g-4 align-items-center">
            <div class="col-lg-6">
                <img [src]="detailImage" class="img-fluid rounded shadow" alt="Portfolio">
            </div>
            <div class="col-lg-6">
                <span class="badge bg-primary mb-2" [attr.data-type]="item.category">{{ item.category }}</span>
                <h2 class="fw-bold mb-3" [innerHTML]="item.title | richText"></h2>
                <p class="text-muted mb-0" [innerHTML]="item.summary | richText"></p>
            </div>
        </div>
    </div>
</section>

<section class="py-5 bg-light">
        <div class="container">
            <div class="text-muted" [innerHTML]="item.detailDescription | richText"></div>
        </div>
</section>
} @else {
<section class="py-5">
    <div class="container text-center">
        <p class="lead text-muted" [innerHTML]="sections['empty']?.message | richText"></p>
    </div>
</section>
}

<app-footer />
